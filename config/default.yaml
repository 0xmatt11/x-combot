# Default moderation settings. Per-conversation overrides are stored in SQLite
# (keyed by dm_conversation_id) and merged on top of this file.

welcome:
  enabled: true
  text: |
    Welcome @{username}!
    I'm Milady bot — I help run this chat.
    I can show !rules, answer with !ask, summarize with !summarize, generate images and videos (!imagine / !video), speak a line (!voice), post fun photos when those commands are enabled, roast with !troll, and track XP (!xp / !top). Type !help for the full list.

# Posted when someone leaves or is removed. X reports both as the same event
# (classic ParticipantsLeave, Chat groupChange membersRemoved), so the line
# does not try to tell a kick apart from a voluntary leave. On by default.
# `{username}` is the @handle when X returns one, otherwise the user id.
leave:
  enabled: true
  text: "@{username} has left"

rules: |
  1. Be respectful — no harassment or hate.
  2. No spam, floods, or unsolicited promo.
  3. Follow X's rules: https://help.x.com/rules-and-policies

help: |
  Commands. / works like !. Your command deletes after 15 minutes; the reply stays. Admin commands: !admin.

  Fun
  !troll @user — roast them until !untroll @user
  !roast @user — one dunk. Does not turn on !troll
  !linkroast on — roast X status links (!linkroast off)
  !xp — your level. !top — leaderboard. Reply + or - on a message

  Chat
  !rules — group rules
  !ask <question> — ask the bot
  !summarize — recap this chat
  !analyze — ask about this chat

  Media
  !imagine <prompt> — image on grok.com/imagine
  !video <prompt> — short video on grok.com/imagine
  !voice — speak a line: Girl 1, regular dude, Girl 2, Girl 3
  !boobs — chest photo from the saved imagine-public bank (off until enabled). Does not open grok.com/imagine
  !ass / !booty — butt photo, same switch (!booties)

  Games:
  !games — full list
  !dice — roll (1d6, or 2d20). !rps — rock-paper-scissors. !coinflip — coin (!flip). !8ball — magic 8-ball (!eightball)
  !minesweeper — 5×5 or 7×7. Full list: !games
  !wordle — daily word (correct, present, or absent). !anagram — unscramble. !scramble — short words. !guess — higher or lower
  !higherlower — cards. !wouldyourather — vote. !truthordare — a prompt
  !tictactoe !connect4 !duel !hangman !story — play with someone
  !slots !blackjack !poker !roulette !crash !trivia — casino and quiz. !trivia picks Easy–Insane
  Open round: a letter, !a, or a short phrase. !ship — @handle or a name in this chat.

admin_help: |
  Admin commands. Not on !help. Reply to someone, or pass @user.

  Owner only
  !auth — exact !auth unlocks a new encrypted group
  !status — owner only (BOT_OWNER_ID), same gate as !auth. ADMIN_IDS and per-group admins are ignored. Health: uptime, public_keys backoff, Imagine (browser or api)

  Moderation
  !warn @user [reason] — add a warning
  !warns @user — warning count
  !unwarn @user — remove one
  !kick @user [reason] — warn and mute. No real kick
  !mute @user [minutes] — soft-mute
  !unmute @user — clear a mute
  !del [id] — delete a message when the API allows

  Notes and settings
  !note [key] [text] — save or list notes
  !get <key> — read a note
  !settings — this chat's settings
  !set <key> <value> — change a setting. flood_max_messages 0 (or negative) disables flood; flood_window_ms 0 does too
  !admin add|remove @user — who can run these
  !admins — list admins

# Off by default. Flood runs only when max_messages and window_ms are both
# above 0. 0 or a negative max_messages disables it, and so does window_ms: 0,
# including a per-conversation !set. window_ms and mute_ms stay so a group can
# turn flood back on without inventing a mute duration.
flood:
  max_messages: 0
  window_ms: 8000
  mute_ms: 300000
  warn_on_flood: true

warns:
  limit: 3
  auto_mute_ms: 3600000
  notify_admins: true

# Keyword / regex filters. Matching MessageCreate events are auto-actioned.
# type: keyword (substring) or regex (JavaScript)
filters:
  - type: keyword
    pattern: "free followers"
    case_insensitive: true
    warn: true
  - type: regex
    pattern: "\\b(crypto\\s*giveaway|whatsapp\\s*me)\\b"
    case_insensitive: true
    warn: true

poll:
  interval_ms: 12000
  max_results: 50
  # Quiet Chat polls wait longer (doubling) up to this cap. A new event resets to interval_ms.
  chat_idle_max_ms: 120000

# X Activity API push for encrypted Chat (chat.received). Off until you opt in.
# transport: stream (this process opens GET /2/activity/stream), webhook, or both.
# When enabled, the Chat poller uses poll_interval_ms as a slow catch-up.
activity:
  enabled: false
  transport: stream
  subscribe: true
  poll_interval_ms: 300000
  webhook_port: 8080
  webhook_path: /webhook

# X DELETE /2/dm_events/:event_id only succeeds for events owned by the
# authenticated bot user. Attempts on other users' messages are logged.
delete:
  attempt_on_filter: true
  attempt_on_flood: true
  attempt_on_mute: true

# ComBot-like XP and levels. On by default in moderated groups (same idea as
# welcome). XP_ENABLED overrides `enabled` (env wins). Per group: !set xp_enabled off.
# Curve is ComBot's published default thresholds (see README). Awards are fixed,
# not random, and each user has a short cooldown so spam does not farm.
# Reaction XP only fires when a reaction-add event is actually delivered
# (encrypted X Chat). Classic group DMs do not send reaction events.
# Reply + / - adds or removes one whole level (floor is level 0). Any member.
# Not yourself. Same giver→target pair is cooled down (default 1 hour, like
# ComBot reputation).
xp:
  enabled: true
  xp_per_message: 10
  xp_per_reaction: 5
  cooldown_ms: 60000
  reactions_enabled: true
  level_grant_enabled: true
  level_grant_cooldown_ms: 3600000
  leaderboard_size: 10

# Adult images (`!boobs`, and `!ass` / `!booty` / `!booties`). Off by default so a moderation
# deploy does not post NSFW. One switch covers all of them: enabled: true or
# BOOBS_ENABLED=true (env wins). These commands use the saved imagine-public
# bank (BOOBS_IMAGINE_APP and the BOOBS_IMAGINE_PUBLIC_* URL lists), then the
# search cascade if that bank is empty. They do not open grok.com/imagine and
# they do not call api.x.ai image generation. !imagine and !video still use
# the Chrome session (IMAGINE_BACKEND=browser). Search is DuckDuckGo by default
# (BOOBS_SEARCH_PROVIDER). If DuckDuckGo fails or its hits are off-topic,
# keyless Bing HTML (adlt=off) runs next, then Reddit. Search also skips the
# last few posted URLs and image hashes in that conversation.
# The command ignores extra text so members cannot change the prompt. A posted
# photo or clip tags the requester (@handle) and, in encrypted Chat, replies
# to their command. See the README.
# !imagine <prompt> uses the Imagine path and does not use this switch.
# Rate limits are off: 0 means unlimited. A positive per-user or per-conversation
# count is enforced only when rate_limit_window_ms is also positive.
# vision: optional download + LLM check (chest/butt subject, no genitalia).
# Off by default. BOOBS_VISION=true overrides this. Needs the configured LLM.
boobs:
  enabled: false
  vision: false
  rate_limit_per_user: 0
  rate_limit_per_conversation: 0
  rate_limit_window_ms: 0

# LLM group-chat assistant. Full conversation context is opt-in because it
# paginates GET /2/dm_conversations/:id/dm_events (~30 day retention, pay-per-use
# X reads) and sends that text to the model (LLM tokens).
# Provider is chosen with env LLM_PROVIDER (wins) or llm.provider below:
#   openai | grok | local  (aliases: xai, ollama, lmstudio, openai-compatible)
llm:
  enabled: true
  provider: openai
  allow: everyone
  wake_prefixes:
    - "!ask"
    - "@bot"
  context_mode: recent
  none_recent_messages: 3
  recent_messages: 20
  full_max_messages: 200
  full_max_chars: 24000
  truncate: oldest
  rate_limit_per_user: 8
  rate_limit_window_ms: 60000
  max_reply_chars: 1800
  max_pages: 5
  system_prompt: |
    You are a helpful assistant in an X (Twitter) group Direct Message.
    You also act as this group's moderation bot (x-combot).
    Be concise and practical. You cannot kick or ban people on X — the public
    API has no remove-participant endpoint. Do not invent X API capabilities.
    When using conversation context, stick to what appears in the thread.

