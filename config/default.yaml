# Default moderation settings. Per-conversation overrides are stored in SQLite
# (keyed by dm_conversation_id) and merged on top of this file.

welcome:
  enabled: true
  text: |
    Welcome @{username}!
    I'm Milady bot — I help run this chat.
    I can show !rules, answer with !ask, summarize with !summarize, generate images and videos (!imagine / !video), speak a line (!voice), post fun photos when those commands are enabled, roast with !troll, and track XP (!xp / !top). Type !help for the full list.

# Posted when someone leaves or is removed. X reports both as the same event
# (classic ParticipantsLeave, Chat groupChange membersRemoved), so the line
# does not try to tell a kick apart from a voluntary leave. On by default.
# `{username}` is the @handle when X returns one, otherwise the user id.
leave:
  enabled: true
  text: "@{username} has left"

rules: |
  1. Be respectful — no harassment or hate.
  2. No spam, floods, or unsolicited promo.
  3. Follow X's rules: https://help.x.com/rules-and-policies

help: |
  Public commands:
    !help — this message
    !rules — group rules
    !boobs — chest / cleavage photo or clip (off unless enabled)
    !ass / !booty / !booties — butt photo or clip (same switch as !boobs)
    !imagine <prompt> — generate an image with Grok Imagine (needs an xAI key)
    !video <prompt> — generate a short video with Grok Imagine (needs an xAI key; takes a few minutes)
    !voice — pick a persona, then a line. Bare !voice lists them: 1 sexy girl, 2 regular dude, 3 scared girl, 4 really horny girl (!voice sexy hello, !voice 2 what's up)
    !troll @user — roast that person in this chat until !untroll @user. A second !troll @user does not turn it off
    !linkroast on — roast people who drop X status links in this chat until !linkroast off
    !noor on — Noor alert for @noorrietje. Relays each new post with the status link, her text, and her photos, labeled as the original, then a separate sarcastic translation. Photo posts also attach an Imagine troll remix. !noor off stops it. Name and on/off are case-insensitive
    !noorabs on — when a Noor alert fires, add "but look at muh pretty abs" and an Imagine close-up of skinny tanned abs. Needs !noor on. !noorabs off stops it
    !xp — your level, XP, and rank (!level and !rank; !xp @user for someone else)
    !top — level leaderboard (!toplvl)
    Reply + or - to a message — give or take one level (not your own)
    !ask <question> — ask the LLM (or @botname …)
    !summarize [focus] — summarize the group thread (loads history)
    !analyze [prompt] — answer about the whole conversation
    !notacommand — unknown bang commands get a short LLM joke when the LLM is on (quiet if it is off)

  Games:
    !dice [NdM] — roll dice (default 1d6; also !dice 2d20, !dice d20, !dice 1d6+2)
    !rps rock|paper|scissors — rock-paper-scissors
    !coinflip [heads|tails] — flip a coin (!flip)
    !8ball <question> — magic 8-ball (!eightball)
    !minesweeper [easy|medium] — text minesweeper (5×5 or 7×7). Full catalog: !games
    !tictactoe [@user] — tic-tac-toe; reply or @ to challenge, 1-9 to move
    !connect4 [@user] — connect four; columns 1-7
    !duel [@user] — turn-based HP duel (attack or defend)
    !hangman [start|@user] — solo or challenge; guess a letter
    !story start|stop|status — one sentence each
    !slots [bet|xp bet] — slot machine (default 10 fun chips)
    !blackjack [bet] — hit/stand vs the dealer (!hit, !stand, !bj)
    !poker [bet] — 5-card draw vs the bot (one draw)
    !roulette <red|black|number> [bet] — spin
    !crash [bet] — cash out with !crash out, or !crash auto 2.5
    !trivia — multiple choice; !trivia a to answer, !trivia score
    !wordle [word] — daily 5-letter puzzle, then a practice round; marks are correct, present, or absent
    !anagram [word] — unscramble a longer word; score drops on each miss
    !scramble [word] — short-word streak; different list and score from !anagram
    !guess [n] — the bot picks the range, then says higher or lower
    !higherlower [higher|lower] — card streak
    !wouldyourather [A|B] — vote; the tally stays in this chat until it expires
    !truthordare [truth|dare] — PG-13 prompt; refuses minors
    !games — grouped catalog of the games above

  Admin commands:
    Reply to someone's message with !warn, !kick, !mute, !unmute, !warns, !unwarn, or !admin add|remove (or /warn, /kick, …) to target that sender. An explicit @user or id still wins. With neither, the bot asks who.
    !warn @user [reason] — add a warning
    !warns @user — show warning count
    !unwarn @user — remove one warning
    !kick @user [reason] — mute + notify (X has no kick API)
    !mute @user [minutes] — local soft-mute
    !unmute @user
    !del [event_id] — try to delete (classic DM: only the bot's own event; Chat: delete-for-all if this account sent it or is a group admin)
    !note [key] [text] — save or list admin notes
    !get <key> — read a note
    !set <key> <value> — per-conversation setting. flood_max_messages 0 (or negative) disables flood; flood_window_ms 0 does too
    !settings — show this conversation's settings (0 disables flood)
    !admin add|remove @user — conversation admin allowlist
    !admins — list admins

# Off by default. Flood runs only when max_messages and window_ms are both
# above 0. 0 or a negative max_messages disables it, and so does window_ms: 0,
# including a per-conversation !set. window_ms and mute_ms stay so a group can
# turn flood back on without inventing a mute duration.
flood:
  max_messages: 0
  window_ms: 8000
  mute_ms: 300000
  warn_on_flood: true

warns:
  limit: 3
  auto_mute_ms: 3600000
  notify_admins: true

# Keyword / regex filters. Matching MessageCreate events are auto-actioned.
# type: keyword (substring) or regex (JavaScript)
filters:
  - type: keyword
    pattern: "free followers"
    case_insensitive: true
    warn: true
  - type: regex
    pattern: "\\b(crypto\\s*giveaway|whatsapp\\s*me)\\b"
    case_insensitive: true
    warn: true

poll:
  interval_ms: 12000
  max_results: 50
  # Quiet Chat polls wait longer (doubling) up to this cap. A new event resets to interval_ms.
  chat_idle_max_ms: 120000

# X Activity API push for encrypted Chat (chat.received). Off until you opt in.
# transport: stream (this process opens GET /2/activity/stream), webhook, or both.
# When enabled, the Chat poller uses poll_interval_ms as a slow catch-up.
activity:
  enabled: false
  transport: stream
  subscribe: true
  poll_interval_ms: 300000
  webhook_port: 8080
  webhook_path: /webhook

# X DELETE /2/dm_events/:event_id only succeeds for events owned by the
# authenticated bot user. Attempts on other users' messages are logged.
delete:
  attempt_on_filter: true
  attempt_on_flood: true
  attempt_on_mute: true

# ComBot-like XP and levels. On by default in moderated groups (same idea as
# welcome). XP_ENABLED overrides `enabled` (env wins). Per group: !set xp_enabled off.
# Curve is ComBot's published default thresholds (see README). Awards are fixed,
# not random, and each user has a short cooldown so spam does not farm.
# Reaction XP only fires when a reaction-add event is actually delivered
# (encrypted X Chat). Classic group DMs do not send reaction events.
# Reply + / - adds or removes one whole level (floor is level 0). Any member.
# Not yourself. Same giver→target pair is cooled down (default 1 hour, like
# ComBot reputation).
xp:
  enabled: true
  xp_per_message: 10
  xp_per_reaction: 5
  cooldown_ms: 60000
  reactions_enabled: true
  level_grant_enabled: true
  level_grant_cooldown_ms: 3600000
  leaderboard_size: 10

# Adult images (`!boobs`, and `!ass` / `!booty` / `!booties`). Off by default so a moderation
# deploy does not post NSFW. One switch covers all of them: enabled: true or
# BOOBS_ENABLED=true (env wins). When XAI_API_KEY (or the grok LLM key) is set,
# the default source is Grok Imagine. BOOBS_IMAGE_PROVIDER=search keeps the
# DuckDuckGo cascade (BOOBS_SEARCH_PROVIDER). If DuckDuckGo fails or its hits
# are off-topic, keyless Bing HTML (adlt=off) runs next, then Reddit. Search
# also skips the last few posted URLs and image hashes in that conversation.
# The command ignores extra text so members cannot change the prompt. See the README.
# !imagine <prompt> uses the same Imagine client and does not use this switch.
# Rate limits are off: 0 means unlimited. A positive per-user or per-conversation
# count is enforced only when rate_limit_window_ms is also positive.
# vision: optional download + LLM check (chest/butt subject, no genitalia).
# Off by default. BOOBS_VISION=true overrides this. Needs the configured LLM.
boobs:
  enabled: false
  vision: false
  rate_limit_per_user: 0
  rate_limit_per_conversation: 0
  rate_limit_window_ms: 0

# LLM group-chat assistant. Full conversation context is opt-in because it
# paginates GET /2/dm_conversations/:id/dm_events (~30 day retention, pay-per-use
# X reads) and sends that text to the model (LLM tokens).
# Provider is chosen with env LLM_PROVIDER (wins) or llm.provider below:
#   openai | grok | local  (aliases: xai, ollama, lmstudio, openai-compatible)
llm:
  enabled: true
  provider: openai
  allow: everyone
  wake_prefixes:
    - "!ask"
    - "@bot"
  context_mode: recent
  none_recent_messages: 3
  recent_messages: 20
  full_max_messages: 200
  full_max_chars: 24000
  truncate: oldest
  rate_limit_per_user: 8
  rate_limit_window_ms: 60000
  max_reply_chars: 1800
  max_pages: 5
  system_prompt: |
    You are a helpful assistant in an X (Twitter) group Direct Message.
    You also act as this group's moderation bot (x-combot).
    Be concise and practical. You cannot kick or ban people on X — the public
    API has no remove-participant endpoint. Do not invent X API capabilities.
    When using conversation context, stick to what appears in the thread.

